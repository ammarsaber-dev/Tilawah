# CI — build + test the Tilawah scheme on an available iPhone simulator.
# No signing (simulator only), no third-party actions beyond checkout.

name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Resolve an available iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          for runtime in sorted(data):
              for device in data[runtime]:
                  if device.get('isAvailable') and device['name'].startswith('iPhone'):
                      print(device['udid'])
                      sys.exit(0)
          sys.exit('No available iPhone simulator found.')
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true

      - name: Build
        run: >
          xcodebuild build
          -scheme Tilawah
          -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}"
          CODE_SIGNING_ALLOWED=NO

      - name: Test (unit + UI)
        run: >
          xcodebuild test
          -scheme Tilawah
          -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}"
          CODE_SIGNING_ALLOWED=NO
